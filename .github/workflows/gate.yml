name: gate

on:
  push:
  pull_request:

permissions:
  contents: read

# A newer push to the same ref makes the older run's result irrelevant.
concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fail instead of silently re-locking if uv.lock is out of date with
      # pyproject.toml, so CI checks exactly the committed dependency set.
      UV_LOCKED: "1"
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"

      # The Makefile is the single source of truth for the jar's checksum;
      # reading it here means bumping the pin also invalidates the cache.
      - name: Read tla2tools checksum
        id: tla
        run: |
          sha=$(sed -n 's/^TLA_SHA256 *:= *//p' Makefile)
          test -n "$sha"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/tla2tools.jar
          key: tla2tools-${{ steps.tla.outputs.sha256 }}

      - run: make gate
