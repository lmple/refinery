[project]
name = "refinery"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "lmple", email = "llievre@protonmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "mcp>=2.3.0",
    "typer>=0.29.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
refinery = "refinery:main"
refine = "refinery.cli.refine:app"

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.pytest]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "N",        # naming
    "PTH",      # pathlib over os.path
    "ASYNC",    # asyncio pitfalls (structured concurrency is the norm here)
    "PT",       # pytest style
    "RUF",      # ruff-specific
]
