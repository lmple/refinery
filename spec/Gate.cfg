\* Gate model: two steps, up to three gate runs (a FailGate loop or a crash
\* restart, then a passing run). Finishes in seconds.
CONSTANTS
    Steps = {s1, s2}
    MaxGates = 3

SPECIFICATION Spec
CONSTRAINT GateBound

INVARIANTS
    TypeOK
    RunningIsRegistered
    OnlyCurrentStepRuns
    OneStepAtATime

PROPERTIES
    PassOnlyIfAllStepsPassed
    ResultOnlyFromFinishedGate
    CancelledIsFinal
