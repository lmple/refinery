\* Gate model: one run, deep. MaxLog 16 covers the happy path (10 events)
\* plus rejection, escalation, crash and trace-failure loops. Runs
\* interacting are checked by RunPair.cfg; both finish in seconds.
CONSTANTS
    Runs = {r1}
    Changes = {c1}
    NoChange = NoChange
    MaxLog = 16

SPECIFICATION Spec
CONSTRAINT LogBound

INVARIANTS
    TypeOK
    OneActiveRunPerChange
    LogMatchesRecord
    CommittedTraceValid
    FrozenMatchesPhase
    ArchivedOnlyWithPassingTrace
    TraceFailOnlyWhileArchiving
    ApprovalsBeforeArchive

PROPERTIES
    TerminalIsFinal
    CommittedEventsImmutable
    FrozenReleasedOnlyByResolve
