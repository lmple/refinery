\* Runner model with two runs and two runners, at most one fault.
CONSTANTS
    Runs = {r1, r2}
    Runners = {x1, x2}
    MaxAttempts = 2
    MaxFaults = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneAgentPerRun
    AgentsOnlyForOpenJobs
    TokenOnlyForOpenJob
    StuckRunsHaveNoJob
    NoOrphansOnceReady

PROPERTIES
    CancelledRunsLoseTheirAgent
    AgentTurnsGetAnAgentOrStuck
