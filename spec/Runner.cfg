\* Runner model: one run, two runners, at most one fault (a runner crash or a
\* lost claim response). Two runners are what "held by at most one runner"
\* and "one agent per run" are about; RunnerRuns.cfg covers two runs.
CONSTANTS
    Runs = {r1}
    Runners = {x1, x2}
    MaxAttempts = 2
    MaxFaults = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    OneAgentPerRun
    AgentsOnlyForOpenJobs
    TokenOnlyForOpenJob
    StuckRunsHaveNoJob
    NoOrphansOnceReady

PROPERTIES
    CancelledRunsLoseTheirAgent
    AgentTurnsGetAnAgentOrStuck
