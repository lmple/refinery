\* Occasional deep check (make tla-big, ~7 min, ~89M states): two runs on
\* one change, each up to 14 events.
CONSTANTS
    Runs = {r1, r2}
    Changes = {c1}
    NoChange = NoChange
    MaxLog = 14

SPECIFICATION Spec
CONSTRAINT LogBound

INVARIANTS
    TypeOK
    OneActiveRunPerChange
    LogMatchesRecord
    CommittedTraceValid
    FrozenMatchesPhase
    ArchivedOnlyWithPassingTrace
    TraceFailOnlyWhileArchiving
    ApprovalsBeforeArchive

PROPERTIES
    TerminalIsFinal
    CommittedEventsImmutable
    FrozenReleasedOnlyByResolve
