\* Gate model: two runs on one change, shallow (MaxLog 8): enough for one
\* run to finish (cancel) and a second to start, or for two StartRuns to
\* race. Deep single-run behaviour is checked by Run.cfg.
CONSTANTS
    Runs = {r1, r2}
    Changes = {c1}
    NoChange = NoChange
    MaxLog = 8

SPECIFICATION Spec
CONSTRAINT LogBound

INVARIANTS
    TypeOK
    OneActiveRunPerChange
    LogMatchesRecord
    CommittedTraceValid
    FrozenMatchesPhase
    ArchivedOnlyWithPassingTrace
    TraceFailOnlyWhileArchiving
    ApprovalsBeforeArchive

PROPERTIES
    TerminalIsFinal
    CommittedEventsImmutable
    FrozenReleasedOnlyByResolve
