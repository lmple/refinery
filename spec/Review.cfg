    TypeOK
    ArchivedOnlyAfterEverything
    ReadyOnlyWhenArchived
    PushedGateHasAPR

PROPERTIES
    ApprovalsAreOfPublishedCommits
    ReviewsAreOfCommits
    GatesGetPublished
    GateRecordsGetCommitted
    ArchiveCompletes
