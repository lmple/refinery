\* Workflow model: two runs, at most one factoryd crash. The state space is
\* finite without a step bound, so the liveness property is checked exactly.
CONSTANTS
    Runs = {r1, r2}
    MaxCrashes = 1

SPECIFICATION Spec

INVARIANTS
    TypeOK
    TokenOnlyForStartedRuns
    GateAndDryRunExclusive
    DryRunOnlyInImpl
    GateOnlyInVerify

PROPERTIES
    AgentNeedsLiveToken
    VerifyResolves
